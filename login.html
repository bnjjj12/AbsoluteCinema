<!DOCTYPE html>

        <p>Continue your movie journey.</p>



        <form id="login-form">

            type="text" 
            placeholder="Username">

        </form>



        <span>
            Don't have an account?
            <a href="register.html">Register</a>
        </span>



    </div>


</div>



<script src="js/login.js"></script>
<script src="js/backbutton.js"></script>
